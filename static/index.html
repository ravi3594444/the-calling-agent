<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calling Agent</title>
<!-- Inline icon: avoids a 404 on /favicon.ico with no extra request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230b0d10%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%227%22%20width%3D%226%22%20height%3D%2211%22%20rx%3D%223%22%20fill%3D%22%234ade80%22%2F%3E%3Cpath%20d%3D%22M10%2016a6%206%200%200%200%2012%200M16%2022v3.5%22%20stroke%3D%22%234ade80%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230b0d10%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%227%22%20width%3D%226%22%20height%3D%2211%22%20rx%3D%223%22%20fill%3D%22%234ade80%22%2F%3E%3Cpath%20d%3D%22M10%2016a6%206%200%200%200%2012%200M16%2022v3.5%22%20stroke%3D%22%234ade80%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<!-- Added to a phone home screen, this should open chrome-less like an app. -->
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calling Agent">
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --line: #232830;
    --text: #e8ebf0; --muted: #8b95a5; --accent: #4ade80; --danger: #f87171;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    /* Centred vertically so the control sits under the thumb on a phone
       rather than stranded at the top of a tall screen. */
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  /* Once a transcript exists the stack grows downward from the top instead. */
  body:has(#log:not(:empty)) { justify-content: flex-start; }
  h1 { font-size: 19px; font-weight: 600; margin: 8px 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  /* Once a call is up, the status line says what is happening instead. */
  body:has(#call[data-state="live"]) .sub,
  body:has(#call[data-state="connecting"]) .sub { visibility: hidden; }
  #call {
    width: 148px; height: 148px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #06240f; font-size: 16px; font-weight: 650;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: 0 0 0 0 rgba(74, 222, 128, .45);
  }
  #call:active { transform: scale(.96); }
  #call svg { width: 30px; height: 30px; display: block; margin: 0 auto 6px; }
  #call[data-state="connecting"] svg { display: none; }
  #call[data-state="live"] { background: var(--danger); color: #2a0808; }
  #call[data-state="connecting"] { background: #3f4652; color: var(--muted); cursor: wait; }
  #call[data-state="live"].speaking { animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(248, 113, 113, .5); }
    100% { box-shadow: 0 0 0 26px rgba(248, 113, 113, 0); }
  }
  #status { margin-top: 20px; font-size: 13px; color: var(--muted); min-height: 20px; text-align: center; }
  #status.error { color: var(--danger); }
  #log {
    width: 100%; max-width: 560px; margin-top: 26px; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    max-height: 46vh; overflow-y: auto; font-size: 14px;
  }
  #log:empty { display: none; }
  .turn { margin: 0 0 10px; }
  .turn:last-child { margin-bottom: 0; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .turn.you .who { color: #7dd3fc; }
  .turn.agent .who { color: var(--accent); }
  .partial { opacity: .5; font-style: italic; }
</style>
</head>
<body>
  <h1>Calling Agent</h1>
  <div class="sub">Tap to start talking</div>
  <button id="call" data-state="idle">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.5" y="3" width="5" height="9"
      rx="2.5" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3.5"
      stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span>Start call</span>
  </button>
  <div id="status"></div>
  <div id="log"></div>

<script type="module">
const SAMPLE_RATE = 24000;

const btn = document.getElementById('call');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

let ws = null, ctx = null, micStream = null, workletNode = null, micSource = null;
// Playback cursor: the context time at which the next chunk should begin.
let nextPlayAt = 0;
let liveSources = new Set();
let partialEl = null;
// Held so a reconnect can rejoin the same agent session rather than starting
// (and separately billing) a new one. The API keeps it alive ~30s.
let sessionId = null;
let reconnectAttempt = 0;
let reconnectTimer = null;
// A rejected session config fails identically on every retry, so reconnecting
// just delays the message the user needs to see.
let fatal = false;

const MAX_RECONNECT_ATTEMPTS = 5;
// Serverless platforms close a WebSocket when the function hits its duration
// limit, so a mid-call drop is expected rather than exceptional.
const RECONNECT_BACKOFF_MS = [500, 1000, 2000, 4000, 8000];

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', isError);
}

function addTurn(who, text) {
  const div = document.createElement('div');
  div.className = `turn ${who === 'You' ? 'you' : 'agent'}`;
  div.innerHTML = `<div class="who"></div><div class="text"></div>`;
  div.querySelector('.who').textContent = who;
  div.querySelector('.text').textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

/* ---------- base64 <-> PCM16 ---------- */

function pcmToBase64(int16) {
  const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
  let out = '';
  // Chunked so we never blow the argument limit on String.fromCharCode.
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(out);
}

function base64ToPCM(b64) {
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length - (bin.length % 2));
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Int16Array(buf);
}

/* ---------- playback ---------- */

function playChunk(b64) {
  if (!ctx) return;
  const pcm = base64ToPCM(b64);
  if (pcm.length === 0) return;

  const buffer = ctx.createBuffer(1, pcm.length, SAMPLE_RATE);
  const out = buffer.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) out[i] = pcm[i] / 0x8000;

  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);

  // Schedule back-to-back. If we have fallen behind (network hiccup), restart
  // the cursor at now, with a small cushion to absorb jitter.
  const now = ctx.currentTime;
  if (nextPlayAt < now) nextPlayAt = now + 0.04;
  src.start(nextPlayAt);
  nextPlayAt += buffer.duration;

  liveSources.add(src);
  src.onended = () => liveSources.delete(src);
}

function stopPlayback() {
  for (const src of liveSources) {
    try { src.stop(); } catch { /* already ended */ }
  }
  liveSources.clear();
  nextPlayAt = 0;
  btn.classList.remove('speaking');
}

/* ---------- server events ---------- */

function handleEvent(ev) {
  switch (ev.type) {
    case 'session.ready':
      if (ev.session_id) sessionId = ev.session_id;
      reconnectAttempt = 0;
      setStatus('Connected — go ahead and speak');
      break;
    case 'reply.started':
      btn.classList.add('speaking');
      break;
    case 'reply.done':
      btn.classList.remove('speaking');
      break;
    case 'transcript.user.delta':
      if (!partialEl) partialEl = addTurn('You', '');
      partialEl.querySelector('.text').textContent = ev.text || ev.transcript || '';
      partialEl.querySelector('.text').classList.add('partial');
      break;
    case 'transcript.user':
      if (partialEl) { partialEl.remove(); partialEl = null; }
      addTurn('You', ev.text || ev.transcript || '');
      break;
    case 'transcript.agent':
      addTurn('Agent', ev.text || ev.transcript || '');
      break;
    case 'session.error':
      setStatus(`Agent error: ${ev.message || 'unknown'}`, true);
      break;
    case 'error':
      fatal = true;
      setStatus(ev.message || 'Server error', true);
      break;
  }
}

/* ---------- socket lifecycle ---------- */

function connectSocket() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  // Resuming is the client's job: on a serverless platform the instance that
  // started the call is not the one handling the reconnect, so there is no
  // server-side memory to look the session up in.
  const query = sessionId ? `?resume=${encodeURIComponent(sessionId)}` : '';
  const socket = new WebSocket(`${scheme}://${location.host}/ws${query}`);
  ws = socket;

  socket.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'audio') playChunk(msg.data);
    else if (msg.type === 'clear') stopPlayback();   // barge-in
    else if (msg.type === 'event') handleEvent(msg.event);
  };

  socket.onclose = () => {
    // Only react if this is still the live socket and the user has not hung up.
    if (socket !== ws || btn.dataset.state !== 'live') return;
    scheduleReconnect();
  };

  return new Promise((resolve, reject) => {
    socket.onopen = resolve;
    socket.onerror = () => reject(new Error('WebSocket connection failed'));
  });
}

function scheduleReconnect() {
  if (fatal) {
    // The status line already carries the reason; keep it on screen.
    endCall(statusEl.textContent, true);
    return;
  }
  if (reconnectAttempt >= MAX_RECONNECT_ATTEMPTS) {
    endCall('Connection lost. Tap to start again.', true);
    return;
  }
  const delay = RECONNECT_BACKOFF_MS[reconnectAttempt];
  reconnectAttempt += 1;

  // Queued playback belongs to a dead socket; dropping it avoids a stale
  // fragment playing after we reconnect.
  stopPlayback();
  setStatus(`Reconnecting… (${reconnectAttempt}/${MAX_RECONNECT_ATTEMPTS})`);

  reconnectTimer = setTimeout(async () => {
    if (btn.dataset.state !== 'live') return;
    try {
      await connectSocket();
      setStatus('Reconnected — keep going');
    } catch {
      scheduleReconnect();
    }
  }, delay);
}

/* ---------- call lifecycle ---------- */

async function startCall() {
  fatal = false;
  btn.dataset.state = 'connecting';
  btn.querySelector('span').textContent = 'Connecting';
  setStatus('Requesting microphone…');

  try {
    // Must run inside the click handler's task: iOS Safari and desktop
    // autoplay policy both require a user gesture before the AudioContext
    // will leave the suspended state or the mic prompt will appear.
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,   // speaker bleed would otherwise be
        noiseSuppression: true,   // transcribed as the user speaking
        autoGainControl: true,
        channelCount: 1,
      },
    });

    ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
    await ctx.resume();
    await ctx.audioWorklet.addModule('/static/pcm-worklet.js');

    setStatus('Connecting to agent…');
    await connectSocket();

    micSource = ctx.createMediaStreamSource(micStream);
    workletNode = new AudioWorkletNode(ctx, 'pcm-capture', {
      numberOfOutputs: 0,
      processorOptions: { inputRate: ctx.sampleRate },
    });
    workletNode.port.onmessage = (e) => {
      if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'audio', data: pcmToBase64(e.data) }));
      }
    };
    micSource.connect(workletNode);

    btn.dataset.state = 'live';
    btn.querySelector('span').textContent = 'End call';
    setStatus('Listening…');
  } catch (err) {
    const msg = err.name === 'NotAllowedError'
      ? 'Microphone permission denied. Allow it and try again.'
      : (err.message || String(err));
    endCall(msg, true);
  }
}

function endCall(message = 'Call ended', isError = false) {
  clearTimeout(reconnectTimer);
  reconnectTimer = null;
  reconnectAttempt = 0;
  sessionId = null;
  stopPlayback();
  workletNode?.port.close();
  micSource?.disconnect();
  workletNode?.disconnect();
  micStream?.getTracks().forEach((t) => t.stop());
  if (ws && ws.readyState <= WebSocket.OPEN) ws.close();
  ctx?.close();
  ws = micStream = workletNode = micSource = ctx = null;
  partialEl = null;

  btn.dataset.state = 'idle';
  btn.querySelector('span').textContent = 'Start call';
  setStatus(message, isError);
}

btn.addEventListener('click', () => {
  if (btn.dataset.state === 'idle') startCall();
  else if (btn.dataset.state === 'live') endCall();
});

if (!navigator.mediaDevices?.getUserMedia) {
  // getUserMedia is unavailable on insecure origins, which is the usual cause.
  btn.disabled = true;
  setStatus(
    location.protocol === 'https:' || location.hostname === 'localhost'
      ? 'This browser does not support microphone capture.'
      : 'Microphone needs HTTPS. Open this page over https:// or on localhost.',
    true,
  );
}
</script>
</body>
</html>
