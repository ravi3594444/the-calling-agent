[project]
name = "calling-agent"
version = "0.1.0"
description = "Real-time voice calling agent on the AssemblyAI Voice Agent API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx2>=0.28",
    # test_packaging.py builds a wheel to check the browser client ships in
    # it. Python 3.12 venvs no longer come with setuptools, and pip builds in
    # an isolated environment the test cannot see, so ask for it here rather
    # than let the check skip itself on the machines that matter.
    "setuptools>=75",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `static/` is the browser client and it lives at the repo root, beside `src/`,
# so it is not inside the package tree and a plain `pip install .` used to
# leave it behind: the wheel had no UI, and `_static_dir()` in main.py fell
# through to a path that cannot exist. Mapping it in as `calling_agent.static`
# ships it inside the wheel without moving the directory, which keeps the
# checkout layout (`make dev`, Docker, Vercel's `includeFiles`) unchanged.
#
# It is the LOWEST-precedence source. `_static_dir()` still prefers STATIC_DIR
# and then the repo root, so a deployment that installs this relay and points
# STATIC_DIR at its own copy keeps serving its own pages, not these.
#
# Listing packages explicitly is what the `static` mapping costs: `find` cannot
# discover a package outside `where`. test_packaging.py asserts the list stays
# complete.
packages = [
    "calling_agent",
    "calling_agent.transport",
    # Not importable packages -- directories of data. setuptools warns that an
    # undeclared one is "absent from the `packages` configuration" and says it
    # may stop shipping such a directory in a future version, so every
    # subdirectory of static/ is named here. test_packaging.py fails if a new
    # one is added without being added here.
    "calling_agent.static",
    "calling_agent.static.js",
    "calling_agent.static.fonts",
]

[tool.setuptools.package-dir]
"" = "src"
"calling_agent.static" = "static"

[tool.setuptools.package-data]
# Recursive: js/ and fonts/ are not packages and must not need to be.
"calling_agent.static" = ["**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
