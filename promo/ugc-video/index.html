<script>
'use strict';
// Tableline: a 34-second vertical UGC-style film where every frame is drawn on a canvas.
//
// Contract (render.mjs relies on it): draw(frame) is a pure function of the frame number.
// No Math.random, no Date, no requestAnimationFrame state: rng()/hash2()/vnoise() only.
// The soundtrack is synthesized with Web Audio from the same beat grid and event list,
// so every cut and every on-screen action has its sound on the same frame.
// Method: iart-ai/javascript-animation-skills (MIT): storyboard as data, one world seen
// through many cameras, boil on the hand-drawn marks, self-checked before delivery.
// The only thing loaded is the app's own Manrope font (static/fonts, SIL OFL).

const W = 1080, H = 1920, FPS = 30, DUR = 34, FRAMES = FPS * DUR;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

const FONTS_READY = Promise.all([500, 600, 700, 800].map(w =>
  new FontFace('Manrope', `url('../../static/fonts/manrope-${w}.woff2')`, { weight: String(w) })
    .load().then(f => document.fonts.add(f))))
  .catch(e => console.warn('Manrope did not load; drawing with a fallback face.', e))
  .then(() => MEMO.clear());
const F = (w, s) => `${w} ${s}px Manrope, "Helvetica Neue", Arial, sans-serif`;

// Tableline's own palette (static/styles.css), plus a coral for the problem and copper
// for candlelight in the room.
const C = {
  bg: '#08090b', panel: '#101214', soft: '#15181b', raised: '#1b1e22', line: '#2b3037',
  lineStrong: '#3a414a', text: '#f5f7fa', muted: '#9ba3ad', lime: '#c8f36a', limeInk: '#243217',
  coral: '#ff796b', coralInk: '#2a0d09', copper: '#d08a55',
};

// ---------- math ----------
const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
const lerp = (a, z, t) => a + (z - a) * t;
const prog = (t, a, z) => clamp((t - a) / (z - a));
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const expo = t => { t = clamp(t); return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); };
const back = t => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function hash2(a, z) {
  let n = Math.imul(a | 0, 374761393) + Math.imul(z | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const MEMO = new Map();
const memo = (key, fn) => { if (!MEMO.has(key)) MEMO.set(key, fn()); return MEMO.get(key); };

// ---------- storyboard: the single source of truth ----------
// 120 bpm, a bar is two seconds, every cut sits on a downbeat. Scenes, cameras and the
// score all read these tables.
const BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT, bt = n => n * BEAT;
const SHOTS = [

  { id: 'S2', from: bt(4), to: bt(8), world: 'floor' },    // missed calls stack up, one per beat
  { id: 'S3', from: bt(8), to: bt(12), world: 'floor' },   // pull out of the phone: a packed room, every hand busy
  { id: 'S4', from: bt(12), to: bt(16), world: 'floor' },  // push in: the call that was a booking, struck out (music drops out)
  { id: 'S5', from: bt(16), to: bt(20), world: 'title' },  // the drop: tableline. logo, morphs into the phone
  { id: 'S6', from: bt(20), to: bt(24), world: 'studio' }, // the call studio; a guest taps Start conversation
  { id: 'S7', from: bt(24), to: bt(28), world: 'studio' }, // orb listens, the guest's words transcribe live

  { id: 'S16', from: bt(60), to: DUR, world: 'end' },       // end card and call to action

const RECEIPT_AT = 20.4;

// what the call studio shows, phase by phase (phase copy is from app.js)

// music per bar: chord voicing, bass root, layers. Problem in A minor, a bar of near
// silence under the lost booking, then the drop into C major (I V vi IV).
const PROBLEM = [[57, 60, 64], [57, 60, 65], [57, 62, 65], [56, 59, 64]], PROBLEM_BASS = [45, 41, 38, 40];
const SOLVED = [[60, 64, 67], [59, 62, 67], [60, 64, 69], [60, 65, 69]], SOLVED_BASS = [36, 43, 45, 41];
const LAYERS = [
  ['padSoft', 'hat8', 'kick4'],

  ['pad', 'hat8', 'kick4', 'clap'],

  ['pad', 'kick4', 'clap', 'bass8', 'hat8', 'crash'],            // the drop, on the logo
  ['pad', 'kick4', 'clap', 'bass8', 'hat16', 'keys'],

  ['pad', 'kick2', 'bassHalf', 'pluck'],
];
const chordAt = bar => bar < 4 ? PROBLEM[bar] : bar >= 16 ? SOLVED[0] : SOLVED[(bar - 4) % 4];
const bassAt = bar => bar < 4 ? PROBLEM_BASS[bar] : bar >= 16 ? SOLVED_BASS[0] : SOLVED_BASS[(bar - 4) % 4];

// ---------- drawing helpers ----------
let BOIL = 0, PX = 1, LAYOUT = [];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, fill, stroke, lw = 1) {
  rr(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function txt(s, x, y, { size = 14, weight = 500, color = C.text, align = 'left', base = 'alphabetic', ls = 0, alpha = 1 } = {}) {
  ctx.save(); ctx.font = F(weight, size); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = ls + 'px'; ctx.globalAlpha *= alpha; ctx.fillText(s, x, y); ctx.restore();
}
function tw(s, size, weight, ls = 0) {
  return memo(`w|${s}|${size}|${weight}|${ls}`, () => {
    ctx.save(); ctx.font = F(weight, size); ctx.letterSpacing = ls + 'px';
    const w = ctx.measureText(s).width; ctx.restore(); return w;
  });
}
// word wrap, memoized; returns lines of words with x offsets so text can type on without reflowing
function wrap(text, size, weight, width, ls = 0) {
  return memo(`wrap|${text}|${size}|${weight}|${width}|${ls}`, () => {
    const space = tw(' ', size, weight, ls), lines = [[]]; let x = 0, i = 0;
    for (const word of text.split(' ')) {
      const w = tw(word, size, weight, ls);
      if (x > 0 && x + w > width) { lines.push([]); x = 0; }
      lines[lines.length - 1].push({ word, x, w, i: i++ }); x += w + space;
    }
    return lines;
  });
}
// the app's own icons (index.html <symbol>s), stroked on a 24-unit grid
const ICONS = {
  phone: 'm8 3 3 5-3 3c1.3 2.3 2.7 3.7 5 5l3-3 5 3-1 4c-1 3-9-1-12-4S1 5 4 4Z',

  hook: 'M7 4v7a4 4 0 0 0 4 4h8m-4-4 4 4-4 4',
  diag: 'M7 17 17 7M9 7h8v8',

const PATHS = Object.fromEntries(Object.entries(ICONS).map(([k, d]) => [k, new Path2D(d)]));
function icon(name, x, y, size, color, lw = 1.5, rot = 0) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(size / 24, size / 24); ctx.translate(-12, -12);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke(PATHS[name]); ctx.restore();
}
function glow(x, y, r, rgb, a) {
  if (a <= 0) return;
  ctx.save(); const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();

// claim what must not collide (checked by render.mjs --check); boxes are stored in screen space
function claim(id, kind, x, y, w, h) {
  const m = ctx.getTransform(), P = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(([a, c]) => [m.a * a + m.c * c + m.e, m.b * a + m.d * c + m.f]);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  LAYOUT.push({ id, kind, x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) });
}

// ---------- hand-drawn marks (the creator scribbling on their screen recording) ----------
function jit(x, y, seed, amp) {
  const s = seed * 13.37, sx = x / PX, sy = y / PX;
  return [
    x + ((vnoise(sx * .012 + s, sy * .012) - .5) * 2 * amp + (vnoise(sx * .09 + s, sy * .09 + 7) - .5) * amp * .6),
    y + ((vnoise(sx * .012, sy * .012 + s + 50) - .5) * 2 * amp + (vnoise(sx * .09 + 3, sy * .09 + s) - .5) * amp * .6),
  ];
}
function tracePath(pts) {
  ctx.beginPath();
  if (pts.length < 3) { ctx.moveTo(...pts[0]); pts.slice(1).forEach(p => ctx.lineTo(...p)); return; }
  ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length - 1; i++) ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  ctx.lineTo(...pts[pts.length - 1]);
}
function ink(pts, { w = 7, col = C.lime, amp = 2.2, seed = 0, alpha = 1 } = {}) {
  if (pts.length < 2) return;
  ctx.save(); ctx.lineCap = ctx.lineJoin = 'round';
  for (let p = 0; p < 2; p++) {
    ctx.globalAlpha = alpha * (p ? .4 : 1); ctx.strokeStyle = col; ctx.lineWidth = w * PX * (p ? .5 : 1);
    tracePath(pts.map(([x, y]) => jit(x, y, BOIL + seed + p * .41, amp * PX * (p ? 1.5 : 1))));
    ctx.stroke();
  }
  ctx.restore();
}
function drawOn(pts, p, o) { if (p > 0) ink(pts.slice(0, Math.max(2, Math.round(pts.length * clamp(p)))), o); }
function scribbleEllipse(cx, cy, rx, ry, seed = 1) {
  const pts = [], n = 96, a0 = -2.5 + hash2(seed, 3) * .4;
  for (let i = 0; i <= n; i++) { const u = i / n, a = a0 + u * Math.PI * 2.24, k = 1 + (u - .5) * .09; pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
  return pts;
}
function scribbleLine(x0, y0, x1, y1, bow = 0, n = 30) {
  const nx = -(y1 - y0), ny = x1 - x0, pts = [];
  for (let i = 0; i <= n; i++) { const u = i / n, k = Math.sin(u * Math.PI) * bow; pts.push([lerp(x0, x1, u) + nx * k, lerp(y0, y1, u) + ny * k]); }
  return pts;
}
function scribbleArrow(x0, y0, x1, y1, p, o = {}) {
  const shaft = scribbleLine(x0, y0, x1, y1, o.bow ?? .18);
  drawOn(shaft, p / .7, o);

// ---------- the voice orb (a port of static/js/visualizer.js, driven by time instead of audio) ----------
const RINGS = 17, POINTS = 100, DOTS = 64;
function orb(x, y, scale, t, phase, level, { alpha = 1, widen = 1 } = {}) {
  const time = t / 1.7, hearing = phase === 'hearing', speaking = phase === 'speaking';
  const thinking = ['thinking', 'working', 'connecting'].includes(phase);
  const hue = hearing ? 166 : 83, sat = speaking ? 51 : 32, energy = level * 19, band = Math.round(level * 20);
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.rotate(time * (thinking ? .12 : .025));
  for (let ring = 0; ring < RINGS; ring++) {
    const radius = 57 + ring * 3.05, spread = .4 + ring / 24, p3 = time + ring * .19, p7 = ring * .14 - time * 1.7;
    const swing = 6 + energy, ripple = 1.7 + energy * .25, drift = time * .6;
    ctx.beginPath();
    for (let i = 0; i <= POINTS; i++) {
      const a = i / POINTS * Math.PI * 2;
      const wave = Math.sin(a * 3 + p3) * Math.cos(a * 2 - drift) * swing + Math.sin(a * 7 + p7) * ripple;
      const r = radius + wave * spread;
      i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r * .95) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r * .95);
    }
    ctx.closePath();
    const a = (.1 + Math.sin(ring / RINGS * Math.PI) * .36 + band / 20 * .14) * alpha;
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${65 + ring}%, ${Math.min(1, a)})`;
    ctx.lineWidth = (ring % 4 === 0 ? 1.15 : .65) * widen; ctx.stroke();
  }
  ctx.rotate(time * .015);
  for (let d = 0; d < DOTS; d++) {
    const ang = d * 2.39996, r = 105 + Math.sin(d * 4.9) * 14 + Math.sin(time + d) * 2;
    ctx.fillStyle = `hsla(${hue},40%,75%,${(.12 + (Math.sin(d + time) + 1) * .13) * alpha})`;
    ctx.beginPath(); ctx.arc(Math.cos(ang) * r, Math.sin(ang) * r, (d % 5 === 0 ? 1 : .55) * widen, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
// how loud the orb is: the host's voice while speaking, the guest's while hearing
function levelAt(t, phase) {
  if (phase === 'speaking') return .22 + .3 * Math.pow(Math.sin(t * 9.1), 2) * vnoise(t * 5, 2) + .12 * vnoise(t * 11, 9);
  if (phase === 'hearing') return .12 + .25 * vnoise(t * 7, 4);
  return 0;
}

  const rev = ac.createConvolver(), wet = ac.createGain(); wet.gain.value = .2; rev.connect(wet); wet.connect(master); M.connect(rev); X.connect(rev);

    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let s = 99 + c; for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = (s / 0x7fffffff * 2 - 1) * Math.pow(1 - i / n, 3.2); } } rev.buffer = ir; }
  const noise = (() => { const n = ac.sampleRate, buf = ac.createBuffer(1, n, n), d = buf.getChannelData(0); let s = 7; for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x7fffffff * 2 - 1; } return buf; })();
  const env = (g, t, a, peak, decay) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0, t + a, decay); };
  function osc(bus, t, type, f, peak, a, decay, f2, glide = .05, pan = 0) {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + glide); p.pan.value = pan; env(g, t, a, peak, decay); o.connect(g); g.connect(p); p.connect(bus); o.start(t); o.stop(t + a + decay * 7);
  }
  function hiss(bus, t, type, f, q, peak, a, decay, f2, glide = .1, pan = 0) {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner(); s.buffer = noise;
    fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + glide); fl.Q.value = q; p.pan.value = pan;
    env(g, t, a, peak, decay); s.connect(fl); fl.connect(g); g.connect(p); p.connect(bus); s.start(t, (t * 7.3) % .5); s.stop(t + a + decay * 7);
  }
  // instruments: a warm, small-hours house kit (soft kick, clap, hats, round bass, string pad, electric piano)
  const kick = (t, a = .9) => osc(M, t, 'sine', 150, a, .002, .12, 44, .1);
  const clap = (t, v = 1) => { hiss(M, t, 'bandpass', 1500, .9, .42 * v, .002, .06); hiss(M, t + .012, 'bandpass', 1750, .9, .3 * v, .002, .08); };
  const hat = (t, a = .1, pan = .3) => hiss(M, t, 'highpass', 7500, .7, a, .001, .025, null, 0, pan);
  const crash = t => hiss(M, t, 'highpass', 5000, .5, .2, .002, .7);
  const bass = (t, m, len) => {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = o2.frequency.value = hz(m); f.type = 'lowpass'; f.frequency.value = 700;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2, t + .01); g.gain.setTargetAtTime(0, t + len * .75, .05);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(M); o.start(t); o2.start(t); o.stop(t + len + .4); o2.stop(t + len + .4);
  };
  const pad = (t, notes, len, a = .04) => notes.forEach((m, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = (i - 1) * 8; f.type = 'lowpass'; f.frequency.value = 1500;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a * .5, t + .5); g.gain.setValueAtTime(a * .5, t + len - .3); g.gain.linearRampToValueAtTime(0, t + len + .25);
    o.connect(f); f.connect(g); g.connect(M); o.start(t); o.stop(t + len + .3);
  });
  const ep = (t, m, a = .1, pan = 0, len = .45) => { osc(M, t, 'sine', hz(m), a, .004, len, null, 0, pan); osc(M, t, 'sine', hz(m) * 2.01, a * .3, .002, len * .35, null, 0, pan); osc(M, t, 'sine', hz(m) * 3.98, a * .1, .001, .05, null, 0, pan); };
  const bars = Math.ceil(DUR / BAR); let prev = [];
  for (let bar = 0; bar < bars; bar++) {
    const L = LAYERS[bar] || [], t0 = T0 + bar * BAR, ch = chordAt(bar), root = bassAt(bar);
    const fresh = n => L.includes(n) && !prev.includes(n) && bar > 0;
    const kv = (fresh('kick4') || fresh('kick2')) && !prev.some(x => x.startsWith('kick')) ? .55 : 1, cv = fresh('clap') ? .6 : 1;
    if (L.includes('pad')) pad(t0, ch.map(m => m + 12), BAR);
    if (L.includes('padSoft')) pad(t0, ch.map(m => m + 12), BAR, .03);
    if (L.includes('crash')) crash(t0);
    for (let s = 0; s < 16; s++) {
      const t = t0 + s * BEAT / 4, on = s % 4 === 0;
      if (L.includes('kick4') && on) kick(t, .9 * kv);
      if (L.includes('kick2') && (s === 0 || s === 8)) kick(t, .6 * kv);
      if (L.includes('clap') && (s === 4 || s === 12)) clap(t, cv);
      if (L.includes('hat8') && s % 2 === 0 && !on) hat(t);
      if (L.includes('hat16') && !on) hat(t, s % 2 ? .055 : .1, s % 2 ? -.3 : .3);
      if (L.includes('bassHalf') && (s === 0 || s === 8)) bass(t, root, 2 * BEAT);
      if (L.includes('bass8') && s % 2 === 0) bass(t, root + (s % 8 === 6 ? 12 : 0), BEAT / 2);
      if (L.includes('keys') && (s === 2 || s === 6 || s === 10 || s === 14)) ch.forEach(m => ep(t, m + 12, .045, 0, .22));
      if (L.includes('lead')) ep(t, [ch[0], ch[1], ch[2], ch[1] + 12][s % 4] + 12, .04, s % 2 ? .35 : -.35, .18);
      if (L.includes('pluck') && on) ep(t, [ch[2], ch[1], ch[0], ch[1]][s / 4] + 12, .09, 0, .5);
    }
    prev = L;
  }
  // a classic two-tone phone ring: 16 Hz clapper on two sines, ring-ring
  const ringTone = (t, peak) => [[0, .38], [.5, .38]].forEach(([d, len]) => [1046, 1318].forEach(f => {
    const o = ac.createOscillator(), am = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain(), hp = ac.createBiquadFilter();
    o.frequency.value = f; lfo.type = 'square'; lfo.frequency.value = 16; lg.gain.value = .5; am.gain.value = .5; hp.type = 'highpass'; hp.frequency.value = 500;
    lfo.connect(lg); lg.connect(am.gain); o.connect(am); am.connect(hp); hp.connect(g); g.connect(X);
    const s = t + d; g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(peak, s + .015); g.gain.setValueAtTime(peak, s + len - .03); g.gain.linearRampToValueAtTime(0, s + len);
    o.start(s); lfo.start(s); o.stop(s + len + .05); lfo.stop(s + len + .05);
  }));
  const FX = {
    ring: t => ringTone(t, .075), ringSoft: t => ringTone(t, .035),
    missed: (t, i = 0) => { osc(X, t, 'sine', 988 - i * 20, .11, .003, .05); osc(X, t + .09, 'sine', 740 - i * 20, .11, .003, .12); },
    whooshIn: t => hiss(X, t, 'bandpass', 300, 1.2, .26, .35, .25, 3500, .45), whooshOut: t => hiss(X, t, 'bandpass', 3500, 1.2, .24, .3, .25, 300, .45),
    whoosh: t => hiss(X, t, 'bandpass', 500, 1, .18, .12, .12, 2500, .25),
    riser: t => { hiss(X, t, 'bandpass', 250, 1.4, .34, 1.05, .05, 6000, 1.1); osc(X, t, 'sawtooth', 110, .035, 1.05, .05, 440, 1.1); },
    sadDown: t => osc(X, t, 'triangle', 523, .12, .01, .25, 262, .45),
    // a clap roll that builds through the break, so the drop lands as a release, not a jump scare
    roll: t => [0, .25, .5, .625, .75, .8125, .875, .9375].forEach((d, i) => { const v = .12 + i * .05; hiss(X, t + d, 'bandpass', 1500 + i * 60, .9, v, .002, .05); hiss(X, t + d + .012, 'bandpass', 1800, .9, v * .6, .002, .06); }),
    pop: (t, i = 0) => osc(X, t, 'sine', 480 + i * 60, .22, .002, .06, 900 + i * 90, .05),
    popLow: (t, i = 0) => osc(X, t, 'sine', 220 + i * 40, .28, .002, .08, 420 + i * 60, .06, i % 2 ? .35 : -.35),
    ding: t => { osc(X, t, 'sine', 1568, .16, .002, .3); osc(X, t, 'sine', 2349, .06, .002, .18); },
    flag: t => { hiss(X, t, 'bandpass', 1800, 1.5, .12, .01, .05); osc(X, t + .04, 'sine', 1319, .17, .002, .3); osc(X, t + .12, 'sine', 1760, .17, .002, .45); },
    notify: t => { osc(X, t, 'sine', 1319, .14, .002, .2); osc(X, t + .09, 'sine', 1976, .12, .002, .3); },
    blip: (t, i = 0) => osc(X, t, 'sine', [1175, 1568, 1319][i], .07, .002, .05),
    tap: t => { hiss(X, t, 'highpass', 3000, .7, .12, .001, .012); osc(X, t, 'sine', 1600, .08, .001, .03); },
    switch: t => hiss(X, t, 'bandpass', 3000, 2, .16, .001, .015),
    swish: t => hiss(X, t, 'bandpass', 1400, 2.5, .1, .03, .07, 3200, .12),
    clack: t => { hiss(X, t, 'bandpass', 2200, 1, .18, .001, .03); osc(X, t, 'sine', 160, .18, .002, .05); },
  };
  for (const [t, name, arg] of EVENTS) { if (!FX[name]) throw new Error(`score: unknown sfx "${name}"`); FX[name](T0 + t, arg); }
  master.gain.setValueAtTime(.9, T0 + DUR - 1.2); master.gain.linearRampToValueAtTime(0, T0 + DUR);
}

window.draw = draw; window.FRAMES = FRAMES; window.FPS = FPS; window.W = W; window.H = H;
window.CUES = SHOTS.slice(1).map(s => s.from);
window.SCORE = ac => buildScore(ac);
window.READY = FONTS_READY;

// live preview when opened directly (render.mjs loads the page with ?render)
if (!new URLSearchParams(location.search).has('render')) {
  FONTS_READY.then(() => {
    let start = performance.now(), ac = null;
    const loop = () => { draw(Math.floor((performance.now() - start) / 1000 * FPS) % FRAMES); requestAnimationFrame(loop); };
    loop();
    addEventListener('click', () => {
      if (ac) ac.close(); ac = new AudioContext(); window.SCORE(ac); start = performance.now() + 60;
      document.getElementById('hint').textContent = 'Playing with sound · click to restart';
    });
  });
} else document.getElementById('hint').remove();
</script>
